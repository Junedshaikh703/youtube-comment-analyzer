<!DOCTYPE html>

<html>
<head>
<title>YouTube Analyzer</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #eef2f7;
    margin: 0;
}

.container {
    max-width: 900px;
    margin: 40px auto;
}

/* CARD */
.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.06);
}

/* INPUT */
input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

button {
    width: 100%;
    padding: 12px;
    background: linear-gradient(90deg,#6366f1,#4f46e5);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

/* PROGRESS BAR */
.progress-bar {
    height: 8px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #6366f1;
    transition: width 0.3s ease;
}

/* STATS */
.stats {
    display: flex;
    justify-content: space-between;
}

.stat {
    text-align: center;
    flex: 1;
}

/* SUMMARY */
#summary {
    line-height: 1.6;
}

/* CHAT UI */
.chat {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    max-width: 80%;
    padding: 12px;
    border-radius: 12px;
}

.comment {
    background: #e0e7ff;
    align-self: flex-start;
}

.reply {
    background: #f3f4f6;
    align-self: flex-end;
}

</style>

</head>

<body>

<div class="container">

<!-- INPUT -->

<div class="card">
<h2>🎥 YouTube Comment Analyzer</h2>

<input id="url" placeholder="Paste YouTube URL">

<br><br>

<button onclick="start()">Analyze</button>

</div>

<!-- PROGRESS -->

<div class="card">
<h3>⚡ Progress</h3>

<div class="progress-bar">
<div id="bar" class="progress-fill"></div>
</div>

<p id="progress">Idle</p>
</div>

<!-- STATS -->

<div class="card">
<h3>📊 Sentiment Overview</h3>

<div class="stats">
<div class="stat">😊<br><span id="pos">0</span></div>
<div class="stat">😡<br><span id="neg">0</span></div>
<div class="stat">❓<br><span id="ques">0</span></div>
<div class="stat">😐<br><span id="neu">0</span></div>
</div>
</div>

<!-- SUMMARY -->

<div class="card">
<h3>🧠 Summary</h3>
<p id="summary">Waiting for analysis...</p>
</div>

<!-- CHAT -->

<div class="card">
<h3>💬 AI Replies</h3>
<div id="chat" class="chat"></div>
</div>

</div>

<script>
let taskId = null;

async function start(){
    const url = document.getElementById("url").value;

    document.getElementById("chat").innerHTML = "";
    document.getElementById("summary").innerText = "Starting...";

    const res = await fetch("/analyze", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({video_url:url})
    });

    const data = await res.json();
    taskId = data.task_id;

    poll();
}

async function poll(){
    const interval = setInterval(async () => {

        const res = await fetch(`/status/${taskId}`);
        const data = await res.json();

        document.getElementById("progress").innerText = data.progress;

        // progress %
        if(data.processed && data.total){
            let percent = (data.processed / data.total) * 100;
            document.getElementById("bar").style.width = percent + "%";
        }

        // stats
        document.getElementById("pos").innerText = data.counts.positive;
        document.getElementById("neg").innerText = data.counts.negative;
        document.getElementById("ques").innerText = data.counts.question;
        document.getElementById("neu").innerText = data.counts.neutral;

        // summary
        if(data.partial_summary){
            document.getElementById("summary").innerText = data.partial_summary;
        }

        if(data.result.summary){
            document.getElementById("summary").innerText = data.result.summary;
        }

        // replies (chat style)
        const chat = document.getElementById("chat");
        chat.innerHTML = "";

        data.result.replies.forEach(r => {
            chat.innerHTML += `
                <div class="message comment">${r[0]}</div>
                <div class="message reply">${r[1]}</div>
            `;
        });

        if(data.status === "completed"){
            clearInterval(interval);
        }

    }, 1500);
}
</script>

</body>
</html>
